# ===============================
# Server Configuration
# ===============================
server.port=8080
# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# Kafka Configuration
# ===============================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=enrollment-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ===============================
# Resilience4j Circuit Breaker
# ===============================
resilience4j.circuitbreaker.instances.enrollment.failureRateThreshold=50
resilience4j.circuitbreaker.instances.enrollment.waitDurationInOpenState=1000ms
resilience4j.circuitbreaker.instances.enrollment.slidingWindowSize=5

# ===============================
# Spring Actuator & Monitoring
# ===============================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=CourseEnrollmentService

# ===============================
# Logging Configuration
# ===============================
logging.level.org.springframework=INFO
logging.level.com.wipro.kafka=DEBUG
eureka.client.enabled=true
